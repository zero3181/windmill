<html><head><meta charset="utf-8"><style>
html,body{margin:0;width:3840px;height:2560px;overflow:hidden;font-family:"Apple SD Gothic Neo",-apple-system,sans-serif}
.sky,.sunset,.glow{position:absolute;inset:0}
.sky{background:linear-gradient(180deg,#86C6FF 0%,#C4E4FF 50%,#EEF6FF 100%)}
.sunset{background:linear-gradient(180deg,#FF9F70 0%,#FFC9B0 50%,#FDEDE6 100%);
  -webkit-mask-image:linear-gradient(90deg,transparent 52%,#000 72%);mask-image:linear-gradient(90deg,transparent 52%,#000 72%)}
.glow{background:radial-gradient(ellipse 1500px 1200px at 60% 60%,rgba(255,250,244,.7) 0%,rgba(255,250,244,0) 70%)}
.title{position:absolute;top:150px;left:0;right:0;text-align:center;color:#0B1B2B;font-weight:800;font-size:150px;letter-spacing:-4px}
.row{position:absolute;top:470px;left:0;right:0;display:flex;justify-content:center;align-items:flex-start;gap:150px}
.dev{width:900px;border-radius:110px;overflow:hidden;border:16px solid #111;box-shadow:0 50px 140px rgba(11,27,43,.25);background:#000}
.dev img{display:block;width:100%}
.mid{margin-top:-40px}
</style></head><body>
<div class="sky"></div><div class="sunset"></div><div class="glow"></div>
<div class="title">매달 만기가 돌아오는 풍차</div>
<div class="row">
  <div class="dev"><img src="raw-iphone/3_progress.png"></div>
  <div class="dev mid"><img src="raw-iphone/1_complete.png"></div>
  <div class="dev"><img src="raw-iphone/4_deposit.png"></div>
</div>
</body></html>
