<html><head><meta charset="utf-8"><script src="windmill.js"></script>
<style>
html,body{margin:0;width:1024px;height:500px;overflow:hidden;font-family:"Apple SD Gothic Neo",-apple-system,sans-serif}
.sky,.sunset,.glow{position:absolute;inset:0}
.sky{background:linear-gradient(180deg,#86C6FF 0%,#B9DFFF 55%,#E6F2FF 100%)}
.sunset{background:linear-gradient(180deg,#FF9F70 0%,#FFC2A6 55%,#FDE6DC 100%);-webkit-mask-image:linear-gradient(90deg,transparent 42%,#000 58%);mask-image:linear-gradient(90deg,transparent 42%,#000 58%)}
.glow{background:radial-gradient(ellipse 320px 280px at 50% 64%,rgba(255,250,244,.95) 0%,rgba(255,250,244,.5) 45%,rgba(255,250,244,0) 75%)}
.hills{position:absolute;left:0;right:0;bottom:0;height:160px}
.title{position:absolute;top:38px;left:0;right:0;text-align:center;color:#0B1B2B;font-weight:800;font-size:48px;letter-spacing:-1.5px}
.mill{position:absolute;bottom:26px}
.mill svg{width:100%;height:100%;display:block;filter:drop-shadow(0 10px 20px rgba(11,27,43,.12))}
</style></head><body>
<div class="sky"></div><div class="sunset"></div><div class="glow"></div>
<svg class="hills" viewBox="0 0 3840 520" preserveAspectRatio="none">
  <path d="M0 300 C 700 170 1300 260 1920 230 C 2550 200 3100 140 3840 260 L3840 520 L0 520 Z" fill="#FFFFFF" fill-opacity="0.45"/>
  <path d="M0 400 C 800 300 1500 380 2100 350 C 2800 320 3300 300 3840 380 L3840 520 L0 520 Z" fill="#FFFFFF" fill-opacity="0.6"/>
</svg>
<div class="title">매달 만기가 돌아오는 풍차</div>
<div class="mill" id="m1" style="left:230px;width:420px;height:329px"></div>
<div class="mill" id="m2" style="left:530px;width:370px;height:290px"></div>
<script>
document.getElementById('m1').innerHTML = windmillSVG({ type: 'savings', filled: 12, rotate: 8, id: 'a' });
document.getElementById('m2').innerHTML = windmillSVG({ type: 'deposit', filled: 12, rotate: -10, id: 'b' });
</script></body></html>
